# Plan morning-digest § 3/§ 4: the preview is built here and deployed as a Pages artifact, never
# committed (ADR 0003). Run with marker=false to upload the same page over the link without it.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show the lane marker in the banner
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack pnpm install --no-frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          corepack pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -sf localhost:8787/digest/2026-10-28 -o _site/index.html
          kill %1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
